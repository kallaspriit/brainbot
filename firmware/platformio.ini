; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:eatspot]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board_build.core = earlephilhower
board_build.filesystem_size = 64k
framework = arduino
board = eatspot
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
; Lets modules include each other by path from src/, e.g. "hardware/BeamServo.hpp",
; so an include line says where a header lives rather than how far up to climb.
build_flags =
    -I src
lib_deps =
    adafruit/Adafruit_VL53L0X@^1.2.5